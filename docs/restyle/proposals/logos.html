<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Proposte di logo</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 150px 1fr 1fr; }
      .label { padding: 24px 16px; background: #fff; color: #1d1d1f; display: flex; align-items: center; font-weight: 600; border-bottom: 1px solid #d9d9de; }
      .cell { padding: 24px 32px; display: flex; align-items: center; gap: 32px; border-bottom: 1px solid #d9d9de; }
      .light { background: #f5f5f7; }
      .dark { background: #0b0d10; }
      .header { background: #15181d; padding: 12px 24px; display: flex; align-items: center; gap: 24px; width: 100%; }
      .header span { color: #f5f5f7; }
      img { display: block; }
    </style>
  </head>
  <body>
    <div class="label">Attuale (ottimizzato)</div>
    <div class="cell light"><img src="../../../public/Images/VT.webp" width="150" height="150" alt=""><img src="../../../public/Images/VT.webp" width="32" height="32" alt=""></div>
    <div class="cell dark"><img src="../../../public/Images/VT.webp" width="150" height="150" alt=""><img src="../../../public/Images/VT.webp" width="32" height="32" alt=""></div>

    <div class="label">A · pastiglia</div>
    <div class="cell light"><img src="logo-a/VT.svg" width="150" alt=""><img src="logo-a/VT.svg" width="64" alt=""></div>
    <div class="cell dark"><img src="logo-a/VT.svg" width="150" alt=""><img src="logo-a/VT.svg" width="64" alt=""></div>

    <div class="label">B · quadrato</div>
    <div class="cell light"><img src="logo-b/VT.svg" width="96" height="96" alt=""><img src="logo-b/VT.svg" width="32" height="32" alt=""></div>
    <div class="cell dark"><img src="logo-b/VT.svg" width="96" height="96" alt=""><img src="logo-b/VT.svg" width="32" height="32" alt=""></div>
  </body>
</html>
