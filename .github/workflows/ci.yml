name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fallisce sugli errori, non sui warning.
      - name: Lint
        run: npm run lint

      # Nessun backend né segreto: la rete è simulata con MSW.
      - name: Test
        run: npm test

      # L'URL vero arriva dall'ambiente di deploy; qui serve solo a far passare la build.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
